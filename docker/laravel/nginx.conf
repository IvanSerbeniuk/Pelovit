# Файл підключається всередині http-блоку, тому map тут дозволений.
# $webp_suffix = ".webp" лише для браузерів, які приймають webp.
map $http_accept $webp_suffix {
    default        "";
    "~*image/webp" ".webp";
}

server {
    listen 8000;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    # Картинки: якщо браузер приймає webp і поруч лежить foo.png.webp — віддаємо
    # його, інакше оригінал. Файли без .webp-пари працюють як раніше.
    # .webp генерує deploy/make-webp.sh, заливається разом з картинками (tar у volume).
    location ~* ^/(images|products|categories|storage)/.+\.(png|jpe?g)$ {
        add_header Vary Accept;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri$webp_suffix $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
