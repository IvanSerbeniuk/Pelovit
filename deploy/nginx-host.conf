# Хост-nginx: розподіляє трафік між Laravel (127.0.0.1:8000) і Nuxt (127.0.0.1:3000).
# У тебе вже є TLS-сервер від certbot для develop-site.online — ДОДАЙ вміст нижче
# всередину існуючого `server { listen 443 ssl; server_name develop-site.online ... }`
# (замінивши дефолтний `location /`).

    client_max_body_size 20M;

    # Спільні proxy-заголовки — наслідуються всіма location без власних proxy_set_header
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Laravel: API, адмінка та бекенд-статика ──
    location /api/        { proxy_pass http://127.0.0.1:8000; }
    location /admin       { proxy_pass http://127.0.0.1:8000; }
    location /vendor/     { proxy_pass http://127.0.0.1:8000; }
    location /storage/    { proxy_pass http://127.0.0.1:8000; }
    location /products/   { proxy_pass http://127.0.0.1:8000; }
    location /categories/ { proxy_pass http://127.0.0.1:8000; }
    location /images/     { proxy_pass http://127.0.0.1:8000; }
    location /build/      { proxy_pass http://127.0.0.1:8000; }

    # ── Nuxt SSR: увесь інший трафік (зокрема robots.txt і sitemap.xml) ──
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
