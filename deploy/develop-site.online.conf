# Готовий site-конфіг для host-nginx (develop-site.online).
# Скопіювати у /etc/nginx/sites-available/develop-site.online, потім nginx -t && reload.
# Канонічний домен — БЕЗ www (щоб фронт і API були в одному origin, без CORS).
# Розподіляє трафік: Laravel (127.0.0.1:8000) для /api /admin та бекенд-статики,
# Nuxt SSR (127.0.0.1:3000) — усе інше.

# ── HTTPS: головний домен (Nuxt + Laravel) ──
server {
    server_name develop-site.online;

    client_max_body_size 20M;

    # Спільні proxy-заголовки (наслідуються location без власних)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Laravel: API та адмінка ──
    location /api/        { proxy_pass http://127.0.0.1:8000; }
    location /admin       { proxy_pass http://127.0.0.1:8000; }

    # ── Бекенд-статика: кешуємо у браузері на 30 днів ──
    location /vendor/     { proxy_pass http://127.0.0.1:8000; add_header Cache-Control "public, max-age=2592000"; }
    location /storage/    { proxy_pass http://127.0.0.1:8000; add_header Cache-Control "public, max-age=2592000"; }
    location /products/   { proxy_pass http://127.0.0.1:8000; add_header Cache-Control "public, max-age=2592000"; }
    location /categories/ { proxy_pass http://127.0.0.1:8000; add_header Cache-Control "public, max-age=2592000"; }
    location /images/     { proxy_pass http://127.0.0.1:8000; add_header Cache-Control "public, max-age=2592000"; }
    location /build/      { proxy_pass http://127.0.0.1:8000; add_header Cache-Control "public, max-age=2592000"; }

    # ── Nuxt SSR: увесь інший трафік (вкл. robots.txt, sitemap.xml) ──
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/develop-site.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/develop-site.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ── HTTPS www → канонічний домен без www ──
server {
    server_name www.develop-site.online;

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/develop-site.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/develop-site.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://develop-site.online$request_uri;
}

# ── HTTP → HTTPS (канонічний, без www) ──
server {
    listen 80;
    listen [::]:80;
    server_name develop-site.online www.develop-site.online;
    return 301 https://develop-site.online$request_uri;
}
